name: Test Build Image

on:
  push:
    branches:
      - '*/*'
  pull_request:
    branches:
      - develop

jobs:
  build:
    name: Build Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get short commit SHA
        run: |
          echo ::set-output name=sha_short::$(echo ${GITHUB_SHA}) | cut -c1-8 
          echo sha_short
          
      - name: Test Build Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile
          push: false
          tags: proteng-conductor:development
          cache-from: type=gha
          cache-to: type=gha,mode=max
  