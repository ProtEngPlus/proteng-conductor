name: Build-Test (dev)

on:
  push:
    branches:
      - feature/ci
      - dev
  pull_request:
    branches:
      - dev

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Check out the repository
        uses: actions/checkout@v3

      - name: Test Build Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and publish Docker Images to GitHub Container registry
          # You may pin to the exact commit or the version.
          # uses: VaultVulp/gp-docker-action@3c0a6ca5c66e31614579048b57259114fb69ac28
        uses: VaultVulp/gp-docker-action@1.6.0
        with:
          # GitHub token to push Docker image to GitHub Packages
          github-token: ${{ secrets.ACTIONS_TOKEN }}
          # Docker Image name
          image-name: proteng-conductor
          # Docker Image tag
          image-tag: test

  
